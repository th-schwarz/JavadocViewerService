databaseChangeLog:
  - changeSet:
      id: 1
      author: th-schwarz
      changes:
        - createTable:
            tableName: git_repository
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: last_tag
                  type: VARCHAR(255)
              - column:
                  name: updated
                  type: TIMESTAMP
